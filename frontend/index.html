<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume Job RAG Matcher</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2933;
        --muted: #5f6f7c;
        --line: #d7dde3;
        --panel: #ffffff;
        --page: #f4f6f8;
        --accent: #0f766e;
        --accent-dark: #0b5f59;
        --warn: #9a3412;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header,
      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
      }

      header {
        padding: 28px 0 18px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 30px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .subhead {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
      }

      main {
        display: grid;
        grid-template-columns: minmax(320px, 420px) 1fr;
        gap: 18px;
        padding-bottom: 40px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
      }

      label {
        display: block;
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 700;
      }

      textarea,
      select,
      input[type="number"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--ink);
        font: inherit;
        background: #fff;
      }

      textarea {
        min-height: 360px;
        resize: vertical;
        padding: 12px;
        line-height: 1.45;
      }

      select,
      input[type="number"] {
        min-height: 38px;
        padding: 8px 10px;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 14px;
      }

      .toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: var(--muted);
        font-size: 14px;
      }

      .upload-row {
        margin-top: 14px;
      }

      input[type="file"] {
        width: 100%;
        border: 1px dashed var(--line);
        border-radius: 6px;
        padding: 10px;
        background: #fff;
        color: var(--muted);
        font: inherit;
      }

      button {
        width: 100%;
        min-height: 42px;
        margin-top: 16px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-dark);
      }

      button:disabled {
        cursor: progress;
        opacity: 0.7;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: start;
        margin-bottom: 14px;
      }

      h2 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0;
      }

      .status {
        color: var(--muted);
        font-size: 13px;
        text-align: right;
      }

      .resume-category-card {
        display: grid;
        grid-template-columns: minmax(180px, 1.25fr) repeat(2, minmax(120px, 0.75fr));
        gap: 12px;
        margin-bottom: 14px;
        border: 1px solid #a7d8d2;
        border-radius: 8px;
        background: #eef8f6;
        padding: 14px;
      }

      .category-summary-label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .category-summary-value {
        margin-top: 4px;
        color: var(--accent-dark);
        font-size: 18px;
        font-weight: 900;
      }

      .category-summary-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }

      .match {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        margin: 12px 0;
      }

      .match-top {
        display: flex;
        justify-content: space-between;
        gap: 14px;
      }

      .title {
        font-size: 17px;
        font-weight: 800;
      }

      .category {
        color: var(--muted);
        font-size: 13px;
        margin-top: 3px;
      }

      .score {
        min-width: 92px;
        text-align: right;
        color: var(--accent-dark);
        font-size: 22px;
        font-weight: 900;
      }

      .score-actions {
        display: grid;
        justify-items: end;
        gap: 8px;
      }

      .preview-button {
        display: inline-grid;
        place-items: center;
        width: 34px;
        min-height: 34px;
        margin-top: 0;
        padding: 0;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
      }

      .preview-button:hover {
        border-color: var(--accent);
        background: #eef8f6;
        color: var(--accent-dark);
      }

      .preview-button svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }

      .breakdown {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 12px 0;
      }

      .metric {
        background: #f8fafb;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px;
        font-size: 13px;
      }

      .metric strong {
        display: block;
        margin-top: 2px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }

      .chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 8px;
        font-size: 12px;
        background: #fff;
      }

      .gap-list {
        display: grid;
        gap: 8px;
      }

      .gap {
        border-left: 3px solid var(--warn);
        padding: 8px 10px;
        background: #fff7ed;
      }

      .gap strong {
        display: block;
      }

      .empty {
        color: var(--muted);
        padding: 28px 0;
        text-align: center;
      }

      .error {
        color: #991b1b;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 6px;
        padding: 10px;
        margin-top: 12px;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgb(15 23 42 / 0.48);
      }

      .modal-backdrop[hidden] {
        display: none;
      }

      .modal {
        width: min(760px, 100%);
        max-height: min(720px, calc(100vh - 40px));
        overflow: hidden;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 24px 70px rgb(15 23 42 / 0.28);
      }

      .modal-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .modal-title {
        margin: 0;
        font-size: 18px;
        line-height: 1.25;
      }

      .modal-meta {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }

      .modal-close {
        display: inline-grid;
        place-items: center;
        width: 34px;
        min-height: 34px;
        margin-top: 0;
        padding: 0;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        font-size: 22px;
        line-height: 1;
      }

      .modal-close:hover {
        border-color: var(--accent);
        background: #eef8f6;
        color: var(--accent-dark);
      }

      .modal-body {
        max-height: calc(min(720px, 100vh - 40px) - 82px);
        overflow: auto;
        padding: 18px;
        white-space: pre-wrap;
        line-height: 1.55;
      }

      @media (max-width: 860px) {
        main {
          grid-template-columns: 1fr;
        }

        .breakdown {
          grid-template-columns: 1fr;
        }

        .resume-category-card {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Resume Job RAG Matcher</h1>
      <p class="subhead">Semantic job retrieval with deterministic match scoring and grounded skill-gap output.</p>
    </header>

    <main>
      <section>
        <form id="match-form">
          <label for="resume">Resume</label>
          <textarea id="resume" name="resume">
Data analyst with experience in Python, SQL, pandas, dashboard reporting, stakeholder communication, machine learning experiments, and cloud data workflows. Built ETL scripts, cleaned large datasets, created BI dashboards, and presented findings to business teams.</textarea
          >

          <div class="upload-row">
            <label for="resume-pdf">Upload PDF resume</label>
            <input id="resume-pdf" type="file" accept="application/pdf,.pdf" />
          </div>

          <div class="controls">
            <div>
              <label for="category-filter">Category filter</label>
              <select id="category-filter">
                <option value="">Any</option>
                <option value="HR">HR</option>
                <option value="INFORMATION-TECHNOLOGY">Information Technology</option>
                <option value="BUSINESS-DEVELOPMENT">Business Development</option>
                <option value="FINANCE">Finance</option>
                <option value="SALES">Sales</option>
              </select>
            </div>
            <div>
              <label for="predicted-category">Resume category</label>
              <select id="predicted-category">
                <option value="">Auto / none</option>
                <option value="HR">HR</option>
                <option value="INFORMATION-TECHNOLOGY">Information Technology</option>
                <option value="BUSINESS-DEVELOPMENT">Business Development</option>
                <option value="FINANCE">Finance</option>
                <option value="SALES">Sales</option>
              </select>
            </div>
            <div>
              <label for="top-k">Top K</label>
              <input id="top-k" type="number" min="1" max="20" value="10" />
            </div>
          </div>

          <label class="toggle">
            <input id="use-llm" type="checkbox" checked />
            Generate LLM explanation
          </label>

          <button id="submit-button" type="submit">Run matcher</button>
          <div id="error"></div>
        </form>
      </section>

      <section>
        <div class="result-header">
          <h2>Matches</h2>
          <div id="status" class="status">Waiting for input</div>
        </div>
        <div id="results" class="empty">Results will appear here after retrieval.</div>
      </section>
    </main>

    <div class="modal-backdrop" id="jd-modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="jd-modal-title">
        <div class="modal-header">
          <div>
            <h2 class="modal-title" id="jd-modal-title">Job Description</h2>
            <div class="modal-meta" id="jd-modal-meta"></div>
          </div>
          <button class="modal-close" id="jd-modal-close" type="button" aria-label="Close job description preview">
            &times;
          </button>
        </div>
        <div class="modal-body" id="jd-modal-body"></div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = "resume-job-rag:last-search";
      const form = document.querySelector("#match-form");
      const button = document.querySelector("#submit-button");
      const results = document.querySelector("#results");
      const statusEl = document.querySelector("#status");
      const errorEl = document.querySelector("#error");
      const resumeInput = document.querySelector("#resume");
      const pdfInput = document.querySelector("#resume-pdf");
      const modal = document.querySelector("#jd-modal");
      const modalTitle = document.querySelector("#jd-modal-title");
      const modalMeta = document.querySelector("#jd-modal-meta");
      const modalBody = document.querySelector("#jd-modal-body");
      const modalClose = document.querySelector("#jd-modal-close");
      let currentMatches = [];

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.innerHTML = "";
        button.disabled = true;
        button.textContent = "Running...";
        statusEl.textContent = pdfInput.files[0]
          ? "Extracting PDF, embedding resume, and querying Pinecone"
          : "Embedding resume and querying Pinecone";
        results.className = "empty";
        results.textContent = "Retrieving matches...";

        const payload = {
          resume_text: resumeInput.value.trim(),
          top_k: Number(document.querySelector("#top-k").value),
          category_filter: document.querySelector("#category-filter").value || null,
          predicted_category: document.querySelector("#predicted-category").value || null,
          use_llm: document.querySelector("#use-llm").checked,
        };

        try {
          const selectedPdf = pdfInput.files[0];
          const response = selectedPdf
            ? await fetch("/match-pdf", {
                method: "POST",
                body: buildPdfFormData(selectedPdf, payload),
              })
            : await fetch("/match", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload),
              });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || "Request failed");
          }
          if (data.resume_markdown) {
            resumeInput.value = data.resume_markdown;
          }
          saveSearchResult(
            {
              ...payload,
              resume_text: data.resume_markdown || payload.resume_text,
              pdf_filename: selectedPdf?.name || null,
            },
            data
          );
          render(data);
        } catch (error) {
          results.className = "empty";
          results.textContent = "No results rendered.";
          errorEl.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
          statusEl.textContent = "Error";
        } finally {
          button.disabled = false;
          button.textContent = "Run matcher";
        }
      });

      function buildPdfFormData(file, payload) {
        const formData = new FormData();
        formData.append("resume_pdf", file);
        formData.append("top_k", String(payload.top_k));
        formData.append("category_filter", payload.category_filter || "");
        formData.append("predicted_category", payload.predicted_category || "");
        formData.append("use_llm", String(payload.use_llm));
        return formData;
      }

      function render(data) {
        currentMatches = data.matches || [];
        const source = data.category_source === "unavailable" ? "no classifier" : data.category_source;
        statusEl.textContent = `${currentMatches.length} matches`;
        const gaps = data.generation.skill_gaps || [];
        const matches = currentMatches;
        const explanationById = new Map(
          (data.generation.ranked_matches || []).map((item) => [String(item.job_id), item])
        );

        results.className = "";
        results.innerHTML = `
          ${renderResumeCategorySummary(data, source)}
          ${data.generation.notes ? `<div class="error">${escapeHtml(data.generation.notes)}</div>` : ""}
          <div class="gap-list">
            ${gaps
              .slice(0, 8)
              .map(
                (gap) => `
                  <div class="gap">
                    <strong>${escapeHtml(gap.skill)}</strong>
                    <span>${escapeHtml(gap.suggestion || "")}</span>
                  </div>
                `
              )
              .join("")}
          </div>
          ${matches.map((item, index) => renderMatch(item, explanationById.get(String(item.job.job_id)), index)).join("")}
        `;
      }

      function renderResumeCategorySummary(data, source) {
        const predictedCategory = data.predicted_category || "Not predicted";
        const retrievalFilter = data.retrieval_category_filter || "Any category";
        return `
          <div class="resume-category-card" aria-label="Resume category prediction">
            <div>
              <div class="category-summary-label">Predicted resume category</div>
              <div class="category-summary-value">${escapeHtml(formatCategoryLabel(predictedCategory))}</div>
              <div class="category-summary-meta">${escapeHtml(predictedCategory)}</div>
            </div>
            <div>
              <div class="category-summary-label">Prediction source</div>
              <div class="category-summary-value">${escapeHtml(formatCategorySource(source))}</div>
            </div>
            <div>
              <div class="category-summary-label">Retrieval filter</div>
              <div class="category-summary-value">${escapeHtml(formatCategoryLabel(retrievalFilter))}</div>
            </div>
          </div>
        `;
      }

      results.addEventListener("click", (event) => {
        const previewButton = event.target.closest("[data-preview-index]");
        if (!previewButton) {
          return;
        }

        const item = currentMatches[Number(previewButton.dataset.previewIndex)];
        if (!item) {
          return;
        }

        openJobModal(item.job);
      });

      function renderMatch(item, explanation, index) {
        const score = item.score;
        const job = item.job;
        const matched = score.matched_skills.slice(0, 10);
        const missing = (explanation?.missing_skills || score.missing_skills).slice(0, 10);
        return `
          <article class="match">
            <div class="match-top">
              <div>
                <div class="title">${escapeHtml(job.job_title)}</div>
                <div class="category">${escapeHtml(job.category)} · Job ID ${escapeHtml(job.job_id)}</div>
              </div>
              <div class="score-actions">
                <div class="score">${score.match_score}%</div>
                <button
                  class="preview-button"
                  type="button"
                  data-preview-index="${index}"
                  aria-label="Preview job description for ${escapeHtml(job.job_title)}"
                  title="Preview JD"
                >${previewIcon()}</button>
              </div>
            </div>
            <div class="breakdown">
              <div class="metric">Semantic<strong>${score.semantic_pct}%</strong></div>
              <div class="metric">Skills<strong>${score.matched_skill_count}/${score.total_skill_count} (${score.skill_overlap_pct}%)</strong></div>
              <div class="metric">Category<strong>${score.category_bonus > 0 ? "match" : "no bonus"}</strong></div>
            </div>
            <p>${escapeHtml(explanation?.why_match || "No generated explanation for this job.")}</p>
            ${matched.length ? `<div class="chips">${matched.map((skill) => `<span class="chip">${escapeHtml(skill)}</span>`).join("")}</div>` : ""}
            ${missing.length ? `<div class="chips">${missing.map((skill) => `<span class="chip">${escapeHtml(skill)}</span>`).join("")}</div>` : ""}
          </article>
        `;
      }

      function previewIcon() {
        return `
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        `;
      }

      function openJobModal(job) {
        modalTitle.textContent = job.job_title || "Job Description";
        modalMeta.textContent = `${job.category || "Unknown category"} · Job ID ${job.job_id || "unknown"}`;
        modalBody.textContent = formatJobDescription(
          job.job_description || "No job description was returned for this result."
        );
        modal.hidden = false;
        modalClose.focus();
      }

      function closeJobModal() {
        modal.hidden = true;
      }

      modalClose.addEventListener("click", closeJobModal);

      modal.addEventListener("click", (event) => {
        if (event.target === modal) {
          closeJobModal();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) {
          closeJobModal();
        }
      });

      function saveSearchResult(payload, data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ payload, data }));
        } catch (error) {
          console.warn("Could not save search result to localStorage", error);
        }
      }

      function restoreSearchResult() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
          if (!saved?.payload || !saved?.data) {
            return;
          }

          resumeInput.value = saved.payload.resume_text || "";
          document.querySelector("#top-k").value = saved.payload.top_k || 10;
          document.querySelector("#category-filter").value = saved.payload.category_filter || "";
          document.querySelector("#predicted-category").value = saved.payload.predicted_category || "";
          document.querySelector("#use-llm").checked = Boolean(saved.payload.use_llm);
          render(saved.data);
        } catch (error) {
          console.warn("Could not restore saved search result", error);
        }
      }

      function formatJobDescription(description) {
        const compact = String(description)
          .replace(/\s+/g, " ")
          .replace(/([a-zA-Z])([A-Z][a-z])/g, "$1 $2")
          .replace(/([.:;])(?=[A-Za-z])/g, "$1 ")
          .replace(/\s+([,.;:])/g, "$1")
          .trim();

        const readable = isMostlyUppercase(compact) ? toSentenceCase(compact) : compact;
        return readable
          .replace(
            /\b(Summary|Job summary|Primary responsibilities|Responsibilities|Qualifications|Required qualifications|Preferred qualifications|Required skills|Preferred skills|About us|About the team)\b:?/gi,
            "\n\n$1\n"
          )
          .replace(/\. (?=[A-Z][a-z]+(?: [A-Z][a-z]+)*:)/g, ".\n\n")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
      }

      function isMostlyUppercase(text) {
        const letters = text.replace(/[^A-Za-z]/g, "");
        if (!letters) {
          return false;
        }
        const upper = letters.replace(/[^A-Z]/g, "");
        return upper.length / letters.length > 0.72;
      }

      function toSentenceCase(text) {
        const lower = text.toLowerCase();
        const sentenceCased = lower.replace(/(^|[.!?]\s+|\n+)([a-z])/g, (match, prefix, letter) => {
          return `${prefix}${letter.toUpperCase()}`;
        });
        return sentenceCased.replace(
          /\b(sql|bi|dax|c#|vba|api|apis|ui|ux|it|ai|ml|llm|llms|hr|aws|s3|nosql|json|xml|html|css|etl|tfl)\b/gi,
          (match) => match.toUpperCase()
        );
      }

      function formatCategoryLabel(category) {
        const value = String(category || "").trim();
        if (!value) {
          return "None";
        }
        if (value === "Any category" || value === "Not predicted") {
          return value;
        }
        return value
          .replaceAll("-", " ")
          .toLowerCase()
          .replace(/\b\w/g, (letter) => letter.toUpperCase())
          .replace(/\bHr\b/g, "HR");
      }

      function formatCategorySource(source) {
        const labels = {
          saved_model: "Saved model",
          classifier: "Fallback classifier",
          request: "Manual override",
          "no classifier": "Unavailable",
          unavailable: "Unavailable",
        };
        return labels[source] || source || "Unavailable";
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      restoreSearchResult();
    </script>
  </body>
</html>
